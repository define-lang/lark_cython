name: Wheels
on: workflow_dispatch

jobs:
  build_sdist:
    name: Build source wheels
    runs-on: ubuntu-latest
    steps:
    - name: Checkout source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up uv and Python
      uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      with:
        python-version: "3.14"
    - name: Build sdist
      run: uv build --sdist --out-dir wheelhouse
    - name: Test installed sdist outside the checkout
      run: |
        cd "$(mktemp -d)"
        uv run --isolated --no-project \
          --with "$GITHUB_WORKSPACE"/wheelhouse/*.tar.gz --with pytest \
          pytest "$GITHUB_WORKSPACE/tests"
    - name: Upload sdist artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: wheels-src
        path: ./wheelhouse/*.tar.gz

  build_binary_wheels:
    name: ${{ matrix.os }}, arch=${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: ["windows-latest", "ubuntu-latest", "macOS-latest"]
        cibw_skip: ["win32"]
        arch: [auto]
        include:
        - os: windows-latest
          arch: auto
          cibw_skip: 'win_amd64'
    steps:
    - name: Checkout source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Enable MSVC 64bit
      uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
      if: matrix.os == 'windows-latest' && matrix.cibw_skip == 'win32'
    - name: Enable MSVC 32bit
      uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
      if: matrix.os == 'windows-latest' && matrix.cibw_skip == 'win_amd64'
      with:
        arch: x86
    - name: Build binary wheels
      uses: pypa/cibuildwheel@e090b81e30c4d855ea63bf4b6e59204c09a101ae # v4.2.1
      with:
        output-dir: wheelhouse
        config-file: pyproject.toml
      env:
        CIBW_BUILD_VERBOSITY: 1
        CIBW_SKIP: "*-${{ matrix.cibw_skip }}"
        CIBW_ARCHS_LINUX: ${{ matrix.arch }}
    - name: Show built files
      shell: bash
      run: ls -la wheelhouse
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      name: Upload wheels artifact
      with:
        name: wheels-${{ matrix.os }}-${{ matrix.cibw_skip }}
        path: ./wheelhouse/*.whl
