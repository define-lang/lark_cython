name: Wheels
on: workflow_dispatch

jobs:
  build_sdist:
    name: Build source wheels
    runs-on: ubuntu-latest
    steps:
    - name: Checkout source
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
    - name: Set up Python 3.10
      uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4.9.1
      with:
        python-version: "3.14"
    - name: Upgrade pip
      run: |-
        python -m pip install --upgrade pip
        python -m pip install setuptools>=0.8 wheel build
    - name: Build sdist
      shell: bash
      run: |-
        python -m build --sdist --outdir wheelhouse
    - name: Install sdist
      run: |-
        ls -al ./wheelhouse
        pip install pytest pytest-cov
        pip install Cython
        pip install wheelhouse/*.tar.gz -v
    - name: Test sdist
      run: |-
        pwd
        ls -al
        # Run in a sandboxed directory
        WORKSPACE_DNAME="testsrcdir_minimal_${CI_PYTHON_VERSION}_${GITHUB_RUN_ID}_${RUNNER_OS}"
        mkdir -p $WORKSPACE_DNAME
        cd $WORKSPACE_DNAME
        # Get path to installed package
        MOD_NAME=lark_cython
        MOD_DPATH=$(python -c "import $MOD_NAME, os; print(os.path.dirname($MOD_NAME.__file__))")
        echo "MOD_DPATH = $MOD_DPATH"
        # Run the tests
        python -m pytest --cov=$MOD_NAME $MOD_DPATH ../tests
        cd ..
    - name: Upload sdist artifact
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: wheels-src
        path: ./wheelhouse/*.tar.gz

  build_binary_wheels:
    name: ${{ matrix.os }}, arch=${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: ["windows-latest", "ubuntu-latest", "macOS-latest"]
        cibw_skip: ["win32"]
        arch: [auto]
        include:
        - os: windows-latest
          arch: auto
          cibw_skip: 'win_amd64'
    steps:
    - name: Checkout source
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
    - name: Enable MSVC 64bit
      uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
      if: matrix.os == 'windows-latest' && matrix.cibw_skip == 'win32'
    - name: Enable MSVC 32bit
      uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
      if: matrix.os == 'windows-latest' && matrix.cibw_skip == 'win_amd64'
      with:
        arch: x86
    - name: Build binary wheels
      uses: pypa/cibuildwheel@e5486e0b831d3a4954f271c2a053fbbc0e227d6a # v2.23.4
      with:
        output-dir: wheelhouse
        config-file: pyproject.toml
      env:
        CIBW_BUILD_VERBOSITY: 1
        #CIBW_TEST_COMMAND: pytest
        CIBW_SKIP: "*-${{ matrix.cibw_skip }}"
        CIBW_ARCHS_LINUX: ${{ matrix.arch }}
    - name: Show built files
      shell: bash
      run: ls -la wheelhouse
    - name: Set up Python 3.10 to combine coverage Linux
      uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4.9.1
      if: runner.os == 'Linux'
      with:
        python-version: "3.14"
    - name: Combine coverage Linux
      if: runner.os == 'Linux'
      run: |-
        echo '############ PWD'
        pwd
        cp .wheelhouse/.coverage* . || true
        ls -al
        python -m pip install coverage[toml]
        echo '############ combine'
        coverage combine . || true
        echo '############ XML'
        coverage xml -o ./tests/coverage.xml || true
        echo '############ FIND'
        find . -name .coverage.* || true
        find . -name coverage.xml  || true
    - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
      name: Codecov Upload
      with:
        file: ./tests/coverage.xml
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      name: Upload wheels artifact
      with:
        name: wheels-${{ matrix.os }}-${{ matrix.cibw_skip }}
        path: ./wheelhouse/*.whl


  publish_wheels:
    name: Publish Wheels
    if: github.repository == 'lark-parser/lark_cython'
    runs-on: ubuntu-latest
    needs:
    - build_binary_wheels
    - build_sdist

    steps:
    - name: Merge wheels
      uses: actions/upload-artifact/merge@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: wheels
        pattern: wheels-*

    - name: Checkout source
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Download wheels and sdist
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        name: wheels
        path: wheelhouse

    - name: Show files to upload
      shell: bash
      run: ls -la wheelhouse

    ### See github action page for details
    # https://github.com/marketplace/actions/pypi-publish

    # ----
    - name: Publish to Live PyPI
      # Only publish real wheels for new git tags.
      if: github.event_name == 'push' && startsWith(github.event.ref, 'refs/tags')
      uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
      with:
        password: ${{ secrets.PYPI_API_TOKEN }}
        skip_existing: true
        #repository_url: https://upload.pypi.org/legacy/  # default url should be fine
        packages_dir: wheelhouse
        verbose: true

    # ----
    - name: Publish to Test PyPI
      uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
      if: github.event_name == 'push' && ! startsWith(github.event.ref, 'refs/tags')
      with:
        password: ${{ secrets.TEST_PYPI_API_TOKEN }}
        skip_existing: true
        repository_url: https://test.pypi.org/legacy/
        packages_dir: wheelhouse
        verbose: true
