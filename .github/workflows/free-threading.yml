name: Free-threaded Python

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13t", "3.14t"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pytest .
      - name: Test the installed extension without forcing the GIL off
        run: |
          mkdir /tmp/lark-thread-tests
          cd /tmp/lark-thread-tests
          python -m pytest "$GITHUB_WORKSPACE/tests"
