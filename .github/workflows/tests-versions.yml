name: Tests
on:
  push:
    branches: [master]
  pull_request:

jobs:
  build_sdist:
    name: Build and test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
    - name: Checkout source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up uv and Python
      uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      with:
        python-version: ${{ matrix.python-version }}
    - name: Build sdist
      run: uv build --sdist --out-dir wheelhouse
    - name: Test installed sdist outside the checkout
      run: |
        cd "$(mktemp -d)"
        uv run --isolated --no-project \
          --with "$GITHUB_WORKSPACE"/wheelhouse/*.tar.gz --with pytest \
          pytest "$GITHUB_WORKSPACE/tests"

  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      with:
        python-version: "3.14"
    - run: uv sync --locked
    - run: uv run --locked pre-commit run --all-files

  coverage:
    name: Cython line coverage
    runs-on: ubuntu-latest
    env:
      LARK_CYTHON_COVERAGE: "1"
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      with:
        # Cython's coverage plugin is reliably supported on Python 3.11.
        python-version: "3.11"
    - run: uv sync --locked
    - run: uv run --locked pytest --cov --cov-report=term-missing --cov-report=xml --cov-report=html
    - run: uv run --locked coverage report --include='*.pyx' --fail-under=98
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: cython-coverage
        path: |
          coverage.xml
          htmlcov/
