repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-illegal-windows-names
      - id: check-json
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-toml
      - id: check-yaml
      - id: destroyed-symlinks
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: name-tests-test
      - id: trailing-whitespace
  - repo: local
    hooks:
      - id: basedpyright
        name: Basedpyright strict type checking
        entry: uv run --locked basedpyright
        language: system
        pass_filenames: false
        always_run: true
      - id: ruff-check
        name: Ruff lint
        entry: uv run --locked ruff check --fix
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: Ruff format
        entry: uv run --locked ruff format
        language: system
        types_or: [python, pyi]
      - id: cython-whitespace
        name: Cython whitespace formatting
        entry: uv run --locked autopep8 --in-place
        language: system
        types: [cython]
      - id: cython-quotes
        name: Cython double quotes
        entry: uv run --locked double-quote-cython-strings
        language: system
        types: [cython]
      - id: cython-lint
        name: Cython lint
        entry: uv run --locked cython-lint
        language: system
        types: [cython]
